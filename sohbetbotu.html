<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capibara</title>
    <link rel="stylesheet" href="sohbetbotu.css">
</head>
<body>
    <div class="chat-container">
        
        <div class="chat-header">
            <div class="bot-info">
                <div class="avatar">🐿️</div>
                <div>
                    <h3>Capibara</h3>
                    <span class="status">cevrimici</span>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chat-box">
            <div class="message-bot">
                <div class="bubble">Iste en cok sorulan sorularin listesi: Sen neyi merak ediyorsun? <ul>            <li>Ne yer?</li>
            <li>Ne kadar büyür?</li>
            <li>Nerede yaşar?</li>
            <li>Kaç yıl yaşar?</li>
            <li>Yüzebilir mi?</li>
            <li>Evde beslenir mi?</li>
            <li>Tehlikeli mi?</li></ul> </div>
            </div>
            <div class="message-user">
                <div class="bubble">...</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Bir mesaj yazin veya komut girin..." autocomplete="off">
            <button id="send-btn">Gonder</button>
        </div>

    </div>
    <script src="sohbetbotu.js"></script>
</body>
</html>
